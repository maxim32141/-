<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Начало таблицы
    <table> - table head
    tr - table row name название таблицы
    tbody - table body данные таблицы
    td - table data значение ячеек-->
    <table class="iksweb">
        <tbody>
            <tr>
                <td></td>
                <td rowspan="2">Заголовок 1</td>
                <td rowspan="2">Заголовок 2</td>
                <td rowspan="2">Заголовок 3</td>
                <td colspan="2">Заголовок 4</td>
            </tr>
            <tr>
                <td></td>
                <td>Подзаголовок 1</td>
                <td>Подзаголовок 2</td>
            </tr>
            <tr>
                <td>Строка 1</td>
                <td>23</td>
                <td>43</td>
                <td>123</td>
                <td>1</td>
                <td>11</td>
            </tr>
            <tr>
                <td>Строка 2</td>
                <td>24</td>
                <td>44</td>
                <td>124</td>
                <td>2</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Строка 3</td>
                <td>25</td>
                <td>45</td>
                <td>125</td>
                <td>3</td>
                <td>13</td>
            </tr>
            <!--tr*3>td2 формула для строк и столбцов-->
        </tbody>
    </table>
</body>
</html>
